{% extends "base.html" %}

{% block title %}Set New Password | Prompt to Product{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 5rem;">
    <div style="max-width: 480px; margin: 0 auto;">
        
        <div class="card" style="border-top: 4px solid var(--success);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; color: #ffffff; margin-bottom: 0.5rem;">Choose New Password</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Ensure your new password is at least 8 characters long.
                </p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label class="form-label" for="password">New Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password <span class="required">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                    Update Password &amp; Login
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
