{% extends "base.html" %}

{% block title %}Forgot Password | Prompt to Product{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 5rem;">
    <div style="max-width: 480px; margin: 0 auto;">
        
        <div class="card" style="border-top: 4px solid var(--primary-light);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; color: #ffffff; margin-bottom: 0.5rem;">Reset Your Password</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Enter your registered email address and we'll dispatch a secure recovery link.
                </p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label class="form-label" for="email">Registered Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="leader@college.edu" required autofocus>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                    Send Password Reset Link
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem;">
                <a href="{{ url_for('auth.login') }}" style="color: var(--text-secondary);">
                    &larr; Return to Sign In
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
