{% extends "base.html" %}

{% block title %}Page Not Found (404) | Prompt to Product{% endblock %}

{% block content %}
<div class="container" style="padding-top: 5rem; padding-bottom: 5rem; text-align: center;">
    <div style="max-width: 550px; margin: 0 auto;">
        <div class="card" style="padding: 3rem 2rem; border-top: 4px solid var(--warning);">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔍</div>
            <span class="badge badge-warning" style="margin-bottom: 1rem;">Error 404</span>
            <h1 style="font-size: 2rem; color: #ffffff; margin-bottom: 0.75rem;">Page Not Found</h1>
            <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem;">
                The requested URL does not exist or has been relocated by the organizing committee.
            </p>
            <div style="display: flex; justify-content: center; gap: 1rem;">
                <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return to Homepage</a>
                <a href="{{ url_for('public.problem_statement') }}" class="btn btn-outline">View Problem Statement</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
